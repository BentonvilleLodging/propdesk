[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Run every day at 8:00 AM UTC (3 AM Central)
[functions."check-due-tasks"]
  schedule = "0 8 * * *"

# Run every day at 11:00 AM UTC (6 AM Central) — after PriceLabs' own
# overnight pricing runs. Reviews now pulled via the real per-listing
# /api/reviews endpoint (fixed 2026-09-17) instead of the broken
# aggregate field.
[functions."get-search-health"]
  schedule = "0 11 * * *"

# Runs 10 minutes after get-search-health, giving recommendation
# generation its own separate execution time budget (see comment in
# get-search-health.js for why these were split apart).
[functions."daily-recommendations-cron"]
  schedule = "10 11 * * *"
