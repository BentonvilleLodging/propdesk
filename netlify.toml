[build]
  publish = "."
  functions = "netlify/functions"

# Never serve server code / config / SQL as static files (publish = ".")
[[redirects]]
  from = "/netlify/*"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/supabase_setup.sql"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/supabase_push_setup.sql"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/supabase_late_checkout_setup.sql"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/supabase_visit_log_setup.sql"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/supabase_rls_lockdown.sql"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Run every day at 8:00 AM UTC (3 AM Central)
[functions."check-due-tasks"]
  schedule = "0 8 * * *"

# Run every day at 11:00 AM UTC (6 AM Central) — after PriceLabs' own
# overnight pricing runs. Converted to a Background Function
# (get-search-health-background.js) since adding the per-listing reviews
# fetch pushed total runtime past the synchronous function limit.
[functions."get-search-health-background"]
  schedule = "0 11 * * *"

# Listing Intelligence analysis (Claude) — runs after the 11:00 data collection.
# Replaces the old daily-recommendations-cron.
[functions."listing-intel-analyze-background"]
  schedule = "40 11 * * *"

# Daily recap data pull (Guesty reservations + GA4 traffic) for the
# 8 AM ET chief-of-staff recap. Reuses the Guesty token cached at 11:00.
[functions."daily-recap-snapshot-background"]
  schedule = "25 11 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
