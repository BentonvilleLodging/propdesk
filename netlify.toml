# Run every day at 8:00 AM UTC (3 AM Central)
[functions."check-due-tasks"]
  schedule = "0 8 * * *"

# Daily jobs. Scheduled functions can't be invoked by URL (Sync/Analyze buttons need
# that) and are limited to 30s, so each schedule runs a tiny cron-* function that
# starts the real Background Function with the internal key.
# 11:00 UTC (6 AM Central): Listing Intelligence data collection
[functions."cron-search-health"]
  schedule = "0 11 * * *"

# 11:25 UTC: daily recap data pull (Guesty reservations + GA4) for the 8 AM ET recap
[functions."cron-recap-snapshot"]
  schedule = "25 11 * * *"

# MONDAY + THURSDAY 11:40 UTC (6:40 AM Central): Listing Intelligence analysis + Search Health
# AGENT — one Claude request per run (whole portfolio, market research, and date price/min-stay
# actions for flagged listings). These two runs use BOTH weekly Claude slots (hard cap 2/week;
# see supabase_agent.sql). Black Cabins changes are applied; everything else waits for approval.
[functions."cron-listing-intel"]
  schedule = "40 11 * * 1,4"

# 12:05 UTC daily (7:05 AM Central): pricing / min-stay autopilot — after the 11:00 data sync.
# Auto-applies ONLY for listings tagged "Black Cabins" in Guesty; everything else waits for approval.
[functions."cron-autopilot"]
  schedule = "5 12 * * *"

# Security headers.
# CSP: scripts only from this site + the Supabase JS library on jsDelivr; network calls
# (fetch/XHR/WebSocket) only to this site and our Supabase project, so injected script
# can't pull in outside code or send a staff session to an attacker's server.
# 'unsafe-inline' is required because index.html uses inline <script> and onclick handlers.
# If something breaks after a deploy, check the browser console for "Content-Security-Policy".
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/@supabase/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://wljtpxqdmxszplngdwsc.supabase.co wss://wljtpxqdmxszplngdwsc.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
