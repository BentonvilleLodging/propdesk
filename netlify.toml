[build]
  publish = "."
  functions = "netlify/functions"

# Never serve server code / config / SQL as static files (publish = ".")
[[redirects]]
  from = "/netlify/*"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/supabase_setup.sql"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/supabase_push_setup.sql"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/supabase_late_checkout_setup.sql"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/supabase_visit_log_setup.sql"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/supabase_autopilot.sql"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/supabase_claude_budget.sql"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/supabase_rls_lockdown.sql"
  to = "/__blocked"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Run every day at 8:00 AM UTC (3 AM Central)
[functions."check-due-tasks"]
  schedule = "0 8 * * *"

# Daily jobs. Scheduled functions can't be invoked by URL (Sync/Analyze buttons need
# that) and are limited to 30s, so each schedule runs a tiny cron-* function that
# starts the real Background Function with the internal key.
# 11:00 UTC (6 AM Central): Listing Intelligence data collection
[functions."cron-search-health"]
  schedule = "0 11 * * *"

# 11:25 UTC: daily recap data pull (Guesty reservations + GA4) for the 8 AM ET recap
[functions."cron-recap-snapshot"]
  schedule = "25 11 * * *"

# MONDAYS 11:40 UTC: Listing Intelligence analysis — the ONE scheduled Claude request per
# week (whole portfolio + market research). Claude is hard-capped at 2 requests/week; see
# supabase_claude_budget.sql. Data collection above still runs daily without Claude.
[functions."cron-listing-intel"]
  schedule = "40 11 * * 1"

# 12:05 UTC daily (7:05 AM Central): pricing / min-stay autopilot — after the 11:00 data sync.
# Auto-applies ONLY for listings tagged "Black Cabins" in Guesty; everything else waits for approval.
[functions."cron-autopilot"]
  schedule = "5 12 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
